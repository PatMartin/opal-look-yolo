[build-system]
requires = ["setuptools>=75,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-look-yolo"
version = "0.1.0"
description = "OPAL Look standalone Ultralytics YOLO inference adapter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "httpx>=0.27,<1.0",
  "typer>=0.12,<1.0",
  "pillow>=10.4,<13.0",
  "jsonschema>=4.23,<5.0"
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3,<9.0"]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.8,<1.0",
  "openapi-spec-validator>=0.7,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
